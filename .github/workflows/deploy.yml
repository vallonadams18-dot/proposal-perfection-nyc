name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      # Stage 1 serves the site from <user>.github.io/<repo>/, so the export
      # needs a basePath or every asset resolves to the github.io root and
      # 404s. Stage 2 adds public/CNAME, the site owns the root, and the
      # prefix has to disappear again.
      #
      # Written to GITHUB_ENV rather than a job-level env: hashFiles() is not
      # valid there (it needs a checked-out workspace) and rejects the whole
      # workflow file. Every later step inherits this, which matters because
      # the build and the link check must agree -- the checker resolves hrefs
      # against ./out, where the prefix is not a real directory.
      - name: Determine base path
        run: |
          if [ -f public/CNAME ]; then
            echo "PAGES_BASE_PATH=" >> "$GITHUB_ENV"
            echo "custom domain present -> no base path"
          else
            echo "PAGES_BASE_PATH=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
            echo "staging -> base path /${GITHUB_REPOSITORY#*/}"
          fi
      - name: Build static site
        run: npm run build
      # Fails the deploy if any booking button points at another company's
      # CheckCherry account, or if an internal link has no page behind it.
      - name: Check links
        run: npm run links:check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
