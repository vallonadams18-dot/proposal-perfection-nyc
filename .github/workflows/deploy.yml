name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      # Until public/CNAME exists the site is served from
      # <user>.github.io/<repo>/, so it needs a basePath or every asset 404s.
      # Once the CNAME lands the site owns the root and the prefix must go.
      - name: Build static site
        run: npm run build
        env:
          PAGES_BASE_PATH: ${{ hashFiles('public/CNAME') == '' && format('/{0}', github.event.repository.name) || '' }}
      # Fails the deploy if any booking button points at another company's
      # CheckCherry account, or if an internal link has no page behind it.
      - name: Check links
        run: npm run links:check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
